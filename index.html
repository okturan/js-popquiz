<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Student Picker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Random Öğrenci Seçici</h1>
    <div id="studentList">
      
    </div>
    <button id="editButton" type="button" aria-pressed="false">Düzenleme modu</button>
    <div id="pickedStudentCard" aria-live="polite" aria-label="Seçilen öğrenci"></div>
    <button id="pickButton" type="button">
      <span class="crooked-text">Öğrenci</span>
      <span class="crossed-out">Kurban</span> <span class="select-text">Seç</span>
    </button>

    <script src="script.js"></script>
  </body>
</html>
